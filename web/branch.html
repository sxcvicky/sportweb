<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf7">
  <meta name="description" content="外贸出海诊断：按阶段分支问诊，免费给你一页诊断报告。">
  <title>外贸出海诊断 · 分支问诊 · 越技</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b1a17'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fffdf7' font-family='serif'%3E越%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/form.css">
</head>
<body class="form-page">
  <main class="shell">
    <header class="form-top pad">
      <a class="icon-btn" id="backLink" href="index.html" aria-label="返回">←</a>
      <div class="form-top__title">
        <strong id="branchTitle">外贸出海诊断</strong>
        <span id="branchSubtitle">按阶段问诊</span>
      </div>
      <span class="pill pill--ghost" id="stepLabel">1 / 3</span>
    </header>
    <div class="progress" aria-hidden="true"><span class="progress__bar" id="progressBar"></span></div>

    <form id="branchForm" novalidate>
      <div id="branchSteps"></div>

      <div class="form-actions">
        <button class="btn btn--ghost" type="button" id="prevBtn" hidden>上一步</button>
        <button class="btn btn--accent" type="button" id="nextBtn">下一步 <span>→</span></button>
        <button class="btn btn--accent" type="submit" id="submitBtn" hidden>提交，去生成诊断报告</button>
      </div>

      <p class="form-foot">提交即表示你理解：诊断只做判断和建议，不构成收入承诺；不适合的，我们会直接说。</p>
    </form>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/branch.js"></script>
</body>
</html>
